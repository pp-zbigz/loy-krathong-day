<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ลอยกระทง บิ๊ก ♡ ขวัญ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap">
<style>
/* Layout: full-screen night river scene; small floating control card on top; two bunnies on the near bank */
:root {
  --sky-top: #1b1440;
  --sky-mid: #3a2a6e;
  --sky-low: #8a5a9e;
  --water-top: #2c2a62;
  --water-low: #120f2e;
  --bank: #1f3b34;
  --bank-hi: #2f5a48;
  --card: rgba(255, 246, 251, 0.94);
  --ink: #4a2f45;
  --ink-soft: #8a6a83;
  --pink: #ff7fb0;
  --pink-soft: #ffd3e4;
  --blue: #7fb8ff;
  --gold: #ffd77a;
  --font-display: "Itim", "Mali", system-ui, sans-serif;
  --font-body: "Mali", "Itim", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 620px; overflow: hidden; }
#sky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 30%, var(--sky-low) 46%, var(--water-top) 46.2%, var(--water-low) 100%);
}
#moon {
  position: absolute; left: 78%; top: 15%; width: clamp(56px, 9vw, 96px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 40% 38%, #fffdf0 0%, #fff4c8 55%, #f7dfa0 100%);
  box-shadow: 0 0 40px 12px rgba(255, 240, 190, .45), 0 0 120px 40px rgba(255, 220, 240, .18);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#lanterns, #floats { position: absolute; inset: 0; pointer-events: none; }
.lantern {
  position: absolute; bottom: 30%; width: 18px; height: 24px; border-radius: 6px 6px 9px 9px;
  background: radial-gradient(circle at 50% 75%, #fff3b8 0%, #ffb35c 45%, #e8743f 100%);
  box-shadow: 0 0 18px 6px rgba(255, 180, 90, .55);
  animation: rise var(--dur, 16s) ease-in forwards;
}
@keyframes rise {
  0% { transform: translate(0, 0) scale(1); opacity: 0; }
  8% { opacity: 1; }
  50% { transform: translate(var(--sway, 20px), -38vh) scale(.75); }
  100% { transform: translate(calc(var(--sway, 20px) * -1), -80vh) scale(.35); opacity: 0; }
}
.floater { position: absolute; left: 0; top: 0; width: var(--kw); will-change: transform; }
.floater .glow {
  position: absolute; left: 50%; top: 70%; width: 170%; height: 60%; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(255, 214, 130, .45), rgba(255, 180, 120, 0) 70%);
  border-radius: 50%;
}
.floater svg { position: relative; display: block; width: 100%; height: auto; }
.wish {
  position: absolute; left: 50%; bottom: 105%; transform: translateX(-50%);
  background: rgba(255, 246, 251, .92); color: var(--ink); font-size: 14px; line-height: 1.35;
  padding: 6px 10px; border-radius: 14px; width: max-content; max-width: 200px; text-align: center;
  animation: wishFade 9s ease forwards; white-space: normal; overflow-wrap: anywhere;
}
@keyframes wishFade { 0%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }

#bank {
  position: absolute; left: 0; right: 0; bottom: 0; height: clamp(150px, 26vh, 230px);
  background: radial-gradient(120% 70% at 50% 0%, var(--bank-hi) 0%, var(--bank) 60%);
  border-radius: 50% 50% 0 0 / 22% 22% 0 0;
}
#bunnies {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  display: flex; gap: clamp(18px, 8vw, 70px); align-items: flex-end;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bunny { position: relative; width: clamp(96px, 24vw, 150px); text-align: center; }
.bunny .body { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.bunny.ready .body { animation: hop .7s ease-in-out infinite; }
.bunny svg.b { display: block; width: 100%; height: auto; }
.bunny img.b { display: block; width: 100%; height: clamp(120px, 30vw, 190px); object-fit: contain; object-position: 50% 100%; }
.bunny.custom .hand { top: 68%; width: 70%; }
.bunny.custom.editable .hand { cursor: grab; touch-action: none; outline: 2px dashed rgba(255, 255, 255, .55); outline-offset: 2px; border-radius: 12px; z-index: 3; }
.bunny.custom.editable .hand.dragging { cursor: grabbing; transition: none; }
.swap { position: absolute; top: 0; right: -6px; border: 0; border-radius: 999px; background: rgba(255, 246, 251, .92); color: var(--ink); font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; z-index: 2; }
.swap:focus-visible { outline: 2px solid var(--pink); }
#temple { position: absolute; left: 50%; bottom: 54%; width: min(620px, 92%); transform: translateX(-50%); pointer-events: none; }
#temple svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 14px rgba(255, 196, 110, .45)); }
#temple-ref { position: absolute; left: 50%; top: 46.2%; width: min(620px, 92%); transform: translateX(-50%) scaleY(-.55); transform-origin: 50% 0; opacity: .32; filter: blur(2px); pointer-events: none; -webkit-mask-image: linear-gradient(to top, #000, transparent 85%); mask-image: linear-gradient(to top, #000, transparent 85%); }
#temple-ref svg { display: block; width: 100%; height: auto; }
.tl { animation: tw 2.4s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .35; } to { opacity: 1; } }
#fwbtn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(clamp(150px, 26vh, 230px) + 12px); border: 0; border-radius: 999px; padding: 10px 16px; font-family: var(--font-display); font-size: 17px; color: #4a2f45; background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 0 18px rgba(255, 215, 122, .6); cursor: pointer; z-index: 3; }
#fwbtn:active { transform: translateY(2px); }
#fwbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.bunny .hand {
  position: absolute; left: 50%; top: 62%; width: 82%; transform: translate(-50%, -50%);
  transition: opacity .3s, transform .3s;
}
.bunny .hand.gone { opacity: 0; transform: translate(-50%, -80%) scale(.6); }
.bunny .hand svg { display: block; width: 100%; height: auto; }
.tag {
  margin-top: 4px; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 17px; color: #fff4fa;
  background: rgba(0, 0, 0, .25); padding: 2px 12px; border-radius: 999px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #8a8aa0; }
.dot.on { background: #7be3a5; box-shadow: 0 0 6px #7be3a5; }
.dot.ready { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
@keyframes idle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px) scaleY(1.03); } }
.flame { transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1); } to { transform: scale(.85, 1.15); } }

#panel {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 380px; box-sizing: border-box;
  background: var(--card); border-radius: 22px; padding: 14px 16px 16px;
  box-shadow: 0 10px 40px rgba(20, 10, 50, .45);
  display: flex; flex-direction: column; gap: 10px;
}
#panel.min .collapsible { display: none; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--pink); text-wrap: balance; line-height: 1.1; }
h1 small { display: block; font-size: 14px; color: var(--ink-soft); font-family: var(--font-body); margin-top: 2px; }
.link { background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.label { font-size: 13px; color: var(--ink-soft); }
.who { flex: 1; min-width: 120px; padding: 12px; border-radius: 16px; border: 2px solid var(--pink-soft); background: #fff; font-family: var(--font-display); font-size: 20px; color: var(--ink); cursor: pointer; }
.who:hover, .who:focus-visible { border-color: var(--pink); outline: none; }
.designs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.design { border: 2px solid transparent; background: #fff; border-radius: 14px; padding: 4px 2px 6px; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); }
.design[aria-pressed="true"] { border-color: var(--pink); background: #fff0f6; }
.design:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.design svg { display: block; width: 70%; margin: 0 auto; height: auto; }
input#wish { width: 100%; box-sizing: border-box; border: 2px solid var(--pink-soft); border-radius: 14px; padding: 9px 12px; font: inherit; font-size: 15px; color: var(--ink); background: #fff; color-scheme: light; }
input#wish:focus { outline: none; border-color: var(--pink); }
.status { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #f6e9f1; color: var(--ink); }
.hint { font-size: 14px; color: var(--ink); line-height: 1.45; margin: 0; }
#go {
  width: 100%; padding: 13px; border: 0; border-radius: 18px; cursor: pointer;
  font-family: var(--font-display); font-size: 21px; color: #fff;
  background: linear-gradient(180deg, #ff9cc4, var(--pink)); box-shadow: 0 4px 0 #e05f95;
}
#go:active { transform: translateY(2px); box-shadow: 0 2px 0 #e05f95; }
#go.waiting { background: linear-gradient(180deg, #c9b6ff, #9f86f0); box-shadow: 0 4px 0 #7c63d0; }
#go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

#countdown {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-display); font-size: clamp(90px, 28vw, 200px); color: #fff;
  text-shadow: 0 0 30px var(--pink), 0 0 60px rgba(255, 127, 176, .6);
}
#countdown span { animation: pop .9s ease-out forwards; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
#banner {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none;
  font-family: var(--font-display); font-size: clamp(28px, 7vw, 54px); color: #fff; text-align: center;
  text-shadow: 0 0 20px var(--pink), 0 2px 0 rgba(0, 0, 0, .2); width: 90%;
  opacity: 0;
}
#banner.show { animation: banner 5s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 15%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
@media (prefers-reduced-motion: reduce) {
  .bunny .body, .flame, .bunny.ready .body { animation: none; }
}
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <canvas id="bg"></canvas>
  <div id="temple"></div>
  <div id="temple-ref"></div>
  <div id="lanterns"></div>
  <div id="floats"></div>
  <div id="bank">
    <div id="bunnies">
      <div class="bunny" id="b-big"><div class="body"></div><div class="tag"><span class="dot"></span>บิ๊ก</div></div>
      <div class="bunny" id="b-kwan"><div class="body"></div><div class="tag"><span class="dot"></span>ขวัญ</div></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <button id="fwbtn" type="button">จุดพลุ</button>
  <div id="banner"></div>
  <div id="countdown"></div>

  <section id="panel" aria-label="ควบคุมการลอยกระทง">
    <div class="head">
      <h1>ลอยกระทงด้วยกัน<small>บิ๊ก ♡ ขวัญ · คืนวันเพ็ญเดือนสิบสอง</small></h1>
      <button class="link" id="toggle" type="button">ซ่อน</button>
    </div>
    <div class="collapsible" id="pick" hidden>
      <p class="hint" style="margin-bottom:8px">เราคือใครเอ่ย?</p>
      <div class="row">
        <button class="who" id="pick-big" type="button">บิ๊ก</button>
        <button class="who" id="pick-kwan" type="button">ขวัญ</button>
      </div>
    </div>
    <div class="collapsible" id="main" hidden>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="sub"><span class="label" id="hello"></span><button class="link" id="switch" type="button">ไม่ใช่เรา?</button></div>
        <div>
          <div class="label" style="margin-bottom:4px">เลือกลายกระทง</div>
          <div class="designs" id="designs"></div>
        </div>
        <input id="wish" maxlength="80" placeholder="อธิษฐานในใจ (เห็นแค่เรา)" autocomplete="off">
        <div class="status" id="status"></div>
        <p class="hint" id="hint"></p>
        <button id="go" type="button">พร้อมลอย ♡</button>
        <div class="sub"><span class="label" id="mode"></span><button class="link" id="solo" type="button">ลอยเลยไม่รอ</button></div>
      </div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  const NAMES = { big: "บิ๊ก", kwan: "ขวัญ" };
  const OTHER = { big: "kwan", kwan: "big" };
  const DESIGNS = {
    sakura: { label: "ซากุระชมพู", leaf: "#7fb069", leaf2: "#5d8f4c", p1: "#ffc4dc", p2: "#ff8fbf", fl: "#fff0f6", dot: "#ff5d9e" },
    star:   { label: "ดาวฟ้าใส",  leaf: "#6fae95", leaf2: "#4f8a73", p1: "#cfe3ff", p2: "#8fb8ff", fl: "#fff6c2", dot: "#ffd54d" },
    sun:    { label: "ทานตะวัน",  leaf: "#8bbd62", leaf2: "#6a9a48", p1: "#ffe9a8", p2: "#ffc94d", fl: "#ffb0c4", dot: "#ff7f7f" }
  };
  const BUNNY = { big: { bow: "#6fb0ff", dress: "#b4d9ff" }, kwan: { bow: "#ff7fb0", dress: "#ffc8dd" } };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const S = {
    me: ["big", "kwan"].includes(store.get("lk.me")) ? store.get("lk.me") : null,
    design: DESIGNS[store.get("lk.design")] ? store.get("lk.design") : "sakura",
    ready: false,
    floats: parseInt(store.get("lk.floats") || "0", 10) || 0,
    fw: 0,
    counting: false
  };
  let room = null;
  const seen = {};

  // ---------- SVG builders ----------
  function krathongSVG(key) {
    const d = DESIGNS[key] || DESIGNS.sakura;
    let leaves = "", petals = "", petals2 = "";
    for (let i = 0; i < 9; i++) {
      const x = 10 + i * 12.5;
      leaves += `<path d="M${x - 7} 74 L${x} ${58 - (i % 2) * 3} L${x + 7} 74 Z" fill="${i % 2 ? d.leaf : d.leaf2}"/>`;
    }
    for (let i = 0; i < 7; i++) {
      const x = 21 + i * 13;
      petals += `<path d="M${x - 8} 64 Q${x} ${36} ${x + 8} 64 Z" fill="${d.p1}" stroke="${d.p2}" stroke-width="1.2"/>`;
    }
    for (let i = 0; i < 5; i++) {
      const x = 34 + i * 13;
      petals2 += `<path d="M${x - 7} 60 Q${x} ${38} ${x + 7} 60 Z" fill="${d.p2}"/>`;
      petals2 += `<circle cx="${x}" cy="52" r="1.6" fill="${d.dot}"/>`;
    }
    let flowers = "";
    [[44, 58], [76, 58], [60, 62]].forEach(([x, y]) => {
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2;
        flowers += `<circle cx="${(x + Math.cos(a) * 3.4).toFixed(1)}" cy="${(y + Math.sin(a) * 3.4).toFixed(1)}" r="2.6" fill="${d.fl}"/>`;
      }
      flowers += `<circle cx="${x}" cy="${y}" r="2" fill="${d.dot}"/>`;
    });
    return `<svg viewBox="0 0 120 92" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="60" cy="80" rx="54" ry="10" fill="#4f6e3a"/>
      <ellipse cx="60" cy="76" rx="54" ry="9" fill="#9cc47a"/>
      <ellipse cx="60" cy="76" rx="46" ry="6" fill="#c9e3a6"/>
      ${leaves}${petals}${petals2}
      <line x1="50" y1="56" x2="47" y2="24" stroke="#8a5a3c" stroke-width="1.4"/>
      <line x1="54" y1="56" x2="53" y2="22" stroke="#8a5a3c" stroke-width="1.4"/>
      <circle cx="47" cy="24" r="1.6" fill="#ff6a3d"/><circle cx="53" cy="22" r="1.6" fill="#ff6a3d"/>
      <rect x="62" y="36" width="7" height="22" rx="2" fill="#fff6e0" stroke="#f0d8a8"/>
      <g class="flame"><path d="M65.5 22 Q70 30 65.5 36 Q61 30 65.5 22 Z" fill="#ffcf5a"/><path d="M65.5 27 Q67.5 31 65.5 35 Q63.5 31 65.5 27 Z" fill="#fff4c4"/></g>
      ${flowers}
    </svg>`;
  }

  function bunnySVG(who) {
    const c = BUNNY[who];
    const line = "#c9a3b3";
    // jasmine + coloured blossoms around the crown
    let crown = "";
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * (1.12 + i * 0.095);
      const x = 70 + Math.cos(a) * 44, y = 100 + Math.sin(a) * 34;
      const col = i % 3 === 1 ? c.bow : "#fffdf6";
      crown += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.4" fill="${col}" stroke="${line}" stroke-width="1"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="#ffd77a"/>`;
    }
    const sash = who === "kwan"
      ? `<path d="M40 138 L100 138 L104 152 L44 176 Z" fill="${c.bow}"/><path d="M44 176 L104 152" stroke="#ffd77a" stroke-width="3"/><path d="M40 138 L100 138" stroke="#ffd77a" stroke-width="3"/>
         <path d="M46 170 Q70 178 96 162 L110 190 Q70 200 30 190 Z" fill="${c.dress}"/>
         <g fill="#ffd77a">${[44, 58, 72, 86, 100].map(x => `<path d="M${x} 186 l4 -5 l4 5 l-4 5 Z"/>`).join("")}</g>`
      : `<path d="M36 138 Q70 128 104 138 L108 168 Q70 176 32 168 Z" fill="${c.dress}"/>
         <path d="M70 134 L70 170" stroke="#ffd77a" stroke-width="2"/>
         <circle cx="70" cy="144" r="2.4" fill="#ffd77a"/><circle cx="70" cy="154" r="2.4" fill="#ffd77a"/><circle cx="70" cy="164" r="2.4" fill="#ffd77a"/>
         <path d="M34 166 Q70 174 106 166 L110 192 Q70 200 30 192 Z" fill="#5b6fb8"/>
         <path d="M34 172 Q70 180 106 172" stroke="#ffd77a" stroke-width="2.4" fill="none"/>`;
    return `<svg class="b" viewBox="0 0 140 206" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="${line}" stroke-width="2.2">
        <path d="M40 74 C26 40 30 8 42 6 C54 4 58 40 56 72 Z" fill="#fff"/>
        <path d="M84 72 C84 40 92 6 104 10 C114 14 108 40 102 58 C108 60 112 66 108 70 Z" fill="#fff"/>
      </g>
      <path d="M43 68 C36 44 38 18 43 14 C49 12 51 44 50 68 Z" fill="#ffc9dc"/>
      <path d="M90 66 C92 42 96 18 102 17 C106 20 102 42 98 62 Z" fill="#ffc9dc"/>
      <ellipse cx="70" cy="203" rx="40" ry="3" fill="rgba(0,0,0,.18)"/>
      <ellipse cx="54" cy="197" rx="13" ry="7" fill="#fff" stroke="${line}" stroke-width="2"/>
      <ellipse cx="86" cy="197" rx="13" ry="7" fill="#fff" stroke="${line}" stroke-width="2"/>
      ${sash}
      <ellipse cx="70" cy="102" rx="48" ry="39" fill="#fff" stroke="${line}" stroke-width="2.2"/>
      ${crown}
      <ellipse cx="53" cy="104" rx="5.6" ry="7" fill="#3d2a38"/><ellipse cx="87" cy="104" rx="5.6" ry="7" fill="#3d2a38"/>
      <circle cx="55" cy="101" r="2.2" fill="#fff"/><circle cx="89" cy="101" r="2.2" fill="#fff"/>
      <circle cx="51.5" cy="107" r="1" fill="#fff"/><circle cx="85.5" cy="107" r="1" fill="#fff"/>
      <ellipse cx="41" cy="117" rx="8.5" ry="5" fill="#ffadc6" opacity=".8"/><ellipse cx="99" cy="117" rx="8.5" ry="5" fill="#ffadc6" opacity=".8"/>
      <path d="M67 112 L73 112 L70 115.5 Z" fill="#ff8fb0"/>
      <path d="M64.5 117 Q67.5 121 70 117.5 Q72.5 121 75.5 117" fill="none" stroke="#3d2a38" stroke-width="1.8" stroke-linecap="round"/>
    </svg>`;
  }

  function templeSVG(lit) {
    const gold = lit ? "url(#tg)" : "#e9b866";
    const dark = "#3a2556";

  function firework(x, y) { burst(x, y, pick(["ring", "heart", "willow"])); }
  function fireworkShow(n) {
    for (let i = 0; i < n; i++) setTimeout(() => rocket(), i * (380 + Math.random() * 300));
  }
  $("fwbtn").onclick = () => {
    fireworkShow(5);
    S.fw++; push();
  };
  function lanterns(n) {
    const box = $("lanterns");
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const l = document.createElement("div");
        l.className = "lantern";
        l.style.left = (5 + Math.random() * 90) + "%";
        l.style.setProperty("--dur", (14 + Math.random() * 8) + "s");
        l.style.setProperty("--sway", ((Math.random() - .5) * 80) + "px");
        l.addEventListener("animationend", () => l.remove());
        box.appendChild(l);
      }, i * 450);
    }
  }
  function celebrate(together) {
    const b = $("banner");
    b.textContent = together ? "ลอยพร้อมกันแล้ว ♡ บิ๊ก & ขวัญ" : "ลอยไปแล้ว ♡";
    b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
    lanterns(together ? 14 : 6);
    setTimeout(() => fireworkShow(together ? 14 : 5), 400);
    if (together) setTimeout(() => { rocket("heart"); rocket("heart"); }, 7000);
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(t) {
    drawBg(reduce ? 0 : t);
    drawFx(t);
    stepFloaters(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  lanterns(4);
  setInterval(() => { if (!document.hidden) lanterns(1); }, 7000);
  setInterval(() => { if (!document.hidden && !reduce) rocket(); }, 6500);
  setTimeout(() => fireworkShow(3), 800);

  render();


  // ---------- character pictures: put big.png / kwan.png next to this file ----------
  const CHAR_IMG = { big: "big.png", kwan: "kwan.png" };
  const CHAR_POS = { big: { x: 51.7, y: 74 }, kwan: { x: 52.7, y: 72.6 } };
  function useImage(who) {
    const img = new Image();
    img.className = "b"; img.alt = NAMES[who];
    img.onload = () => {
      artEl[who].innerHTML = "";
      artEl[who].appendChild(img);
      bunnyEl[who].classList.add("custom");
      handEl[who].style.left = CHAR_POS[who].x + "%";
      handEl[who].style.top = CHAR_POS[who].y + "%";
    };
    img.src = CHAR_IMG[who];
  }
  useImage("big"); useImage("kwan");

  // ---------- realtime sync over a public MQTT broker (no login) ----------
  const ROOM_TOPIC = "loykrathong-bk/" + "r7q3m9x2v5";
  const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
  const STALE_MS = 3 * 60 * 1000;
  function makeRoom() {
    if (!window.mqtt) return null;
    const myId = Math.random().toString(36).slice(2, 12);
    const others = new Map();
    let mine = {}, frozen = Object.freeze([]), listeners = [], client = null, brokerIdx = 0;
    const stateTopic = (id) => ROOM_TOPIC + "/state/" + id;
    function rebuild() {
      const now = Date.now();
      const list = [];
      for (const [id, v] of others) {
        if (now - v.seenAt > STALE_MS && now - (v.presence.t || 0) > STALE_MS) continue;
        list.push(Object.freeze({ peer: id, kind: "viewer", sameTab: false, isMe: false, presence: Object.freeze(v.presence), updatedAt: v.updatedAt }));
      }
      frozen = Object.freeze(list);
      listeners.forEach((fn) => { try { fn({ peers: frozen }); } catch (e) {} });
    }
    function publishMine() {
      if (!client || !client.connected) return;
      client.publish(stateTopic(myId), JSON.stringify({ ...mine, t: Date.now() }), { retain: true, qos: 1 });
    }
    function connect() {
      const url = BROKERS[brokerIdx % BROKERS.length];
      client = mqtt.connect(url, {
        clientId: "lk_" + myId, clean: true, reconnectPeriod: 3000, connectTimeout: 8000,
        will: { topic: stateTopic(myId), payload: "", retain: true, qos: 1 }
      });
      let opened = false;
      const failover = setTimeout(() => { if (!opened) { client.end(true); brokerIdx++; connect(); } }, 9000);
      client.on("connect", () => {
        opened = true; clearTimeout(failover);
        client.subscribe(ROOM_TOPIC + "/state/+", { qos: 1 });
        publishMine();
      });
      client.on("message", (topic, payload) => {
        const id = topic.split("/").pop();
        if (id === myId) return;
        const text = payload.toString();
        if (!text) { others.delete(id); rebuild(); return; }
        let data;
        try { data = JSON.parse(text); } catch (e) { return; }
        if (!data || typeof data !== "object") return;
        const prev = others.get(id);
        if (Date.now() - (data.t || 0) > STALE_MS && !prev) return;
        others.set(id, { presence: data, updatedAt: Date.now(), seenAt: Date.now() });
        rebuild();
      });
    }
    connect();
    addEventListener("pagehide", () => { try { client.publish(stateTopic(myId), "", { retain: true, qos: 0 }); client.end(); } catch (e) {} });
    setInterval(() => { publishMine(); rebuild(); }, 60000);
    return {
      peers: () => frozen,
      presence(patch) { mine = { ...mine, ...patch }; publishMine(); return Promise.resolve(); },
      onPeers(fn) { listeners.push(fn); setTimeout(() => fn({ peers: frozen }), 0); return () => {}; }
    };
  }
  room = makeRoom();
  if (room) { room.onPeers(onRoomChange); push(); }
  render();
})();
</script>
