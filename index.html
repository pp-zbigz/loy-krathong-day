<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ลอยกระทง บิ๊ก ♡ ขวัญ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap">
<style>
/* Layout: full-screen night river scene; small floating control card on top; two bunnies on the near bank */
:root {
  --sky-top: #1b1440;
  --sky-mid: #3a2a6e;
  --sky-low: #8a5a9e;
  --water-top: #2c2a62;
  --water-low: #120f2e;
  --bank: #1f3b34;
  --bank-hi: #2f5a48;
  --card: rgba(255, 246, 251, 0.94);
  --ink: #4a2f45;
  --ink-soft: #8a6a83;
  --pink: #ff7fb0;
  --pink-soft: #ffd3e4;
  --blue: #7fb8ff;
  --gold: #ffd77a;
  --font-display: "Itim", "Mali", system-ui, sans-serif;
  --font-body: "Mali", "Itim", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 620px; overflow: hidden; }
#sky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 30%, var(--sky-low) 46%, var(--water-top) 46.2%, var(--water-low) 100%);
}
#moon {
  position: absolute; left: 78%; top: 15%; width: clamp(56px, 9vw, 96px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 40% 38%, #fffdf0 0%, #fff4c8 55%, #f7dfa0 100%);
  box-shadow: 0 0 40px 12px rgba(255, 240, 190, .45), 0 0 120px 40px rgba(255, 220, 240, .18);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#lanterns, #floats { position: absolute; inset: 0; pointer-events: none; }
.lantern {
  position: absolute; bottom: 30%; width: 18px; height: 24px; border-radius: 6px 6px 9px 9px;
  background: radial-gradient(circle at 50% 75%, #fff3b8 0%, #ffb35c 45%, #e8743f 100%);
  box-shadow: 0 0 18px 6px rgba(255, 180, 90, .55);
  animation: rise var(--dur, 16s) ease-in forwards;
}
@keyframes rise {
  0% { transform: translate(0, 0) scale(1); opacity: 0; }
  8% { opacity: 1; }
  50% { transform: translate(var(--sway, 20px), -38vh) scale(.75); }
  100% { transform: translate(calc(var(--sway, 20px) * -1), -80vh) scale(.35); opacity: 0; }
}
.floater { position: absolute; left: 0; top: 0; width: var(--kw); will-change: transform; }
.floater .glow {
  position: absolute; left: 50%; top: 70%; width: 170%; height: 60%; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(255, 214, 130, .45), rgba(255, 180, 120, 0) 70%);
  border-radius: 50%;
}
.floater svg { position: relative; display: block; width: 100%; height: auto; }
.wish {
  position: absolute; left: 50%; bottom: 105%; transform: translateX(-50%);
  background: rgba(255, 246, 251, .92); color: var(--ink); font-size: 14px; line-height: 1.35;
  padding: 6px 10px; border-radius: 14px; width: max-content; max-width: 200px; text-align: center;
  animation: wishFade 9s ease forwards; white-space: normal; overflow-wrap: anywhere;
}
@keyframes wishFade { 0%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }

#bank {
  position: absolute; left: 0; right: 0; bottom: 0; height: clamp(150px, 26vh, 230px);
  background: radial-gradient(120% 70% at 50% 0%, var(--bank-hi) 0%, var(--bank) 60%);
  border-radius: 50% 50% 0 0 / 22% 22% 0 0;
}
#bunnies {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  display: flex; gap: clamp(18px, 8vw, 70px); align-items: flex-end;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bunny { position: relative; width: clamp(96px, 24vw, 150px); text-align: center; }
.bunny .body { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.bunny.ready .body { animation: hop .7s ease-in-out infinite; }
.bunny svg.b { display: block; width: 100%; height: auto; }
.bunny img.b { display: block; width: 100%; height: clamp(120px, 30vw, 190px); object-fit: contain; object-position: 50% 100%; }
.bunny.custom .hand { top: 68%; width: 70%; }
.bunny.custom.editable .hand { cursor: grab; touch-action: none; outline: 2px dashed rgba(255, 255, 255, .55); outline-offset: 2px; border-radius: 12px; z-index: 3; }
.bunny.custom.editable .hand.dragging { cursor: grabbing; transition: none; }
.swap { position: absolute; top: 0; right: -6px; border: 0; border-radius: 999px; background: rgba(255, 246, 251, .92); color: var(--ink); font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; z-index: 2; }
.swap:focus-visible { outline: 2px solid var(--pink); }
#pier { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: clamp(260px, 62vw, 480px); height: calc(100% + 46px); pointer-events: none; }
#pier svg { display: block; width: 100%; height: 100%; }
.stall { position: absolute; bottom: 18px; width: clamp(110px, 17vw, 170px); pointer-events: none; }
.stall svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 10px rgba(255, 190, 110, .35)); }
#stallL { left: max(8px, env(safe-area-inset-left, 0px)); }
#stallR { right: max(8px, env(safe-area-inset-right, 0px)); bottom: 70px; }
@media (max-width: 640px) { .stall { display: none; } }
.lamp { animation: lampglow 1.8s ease-in-out infinite alternate; }
@keyframes lampglow { from { opacity: .75; } to { opacity: 1; } }
#temple { position: absolute; left: 50%; bottom: 54%; width: min(520px, 70%); transform: translateX(-50%); pointer-events: none; }
#temple svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 14px rgba(255, 196, 110, .45)); }
#temple-ref { position: absolute; left: 50%; top: 46.2%; width: min(520px, 70%); transform: translateX(-50%) scaleY(-.55); transform-origin: 50% 0; opacity: .32; filter: blur(2px); pointer-events: none; -webkit-mask-image: linear-gradient(to top, #000, transparent 85%); mask-image: linear-gradient(to top, #000, transparent 85%); }
#temple-ref svg { display: block; width: 100%; height: auto; }
.tl { animation: tw 2.4s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .35; } to { opacity: 1; } }
#fwbtn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(clamp(150px, 26vh, 230px) + 12px); border: 0; border-radius: 999px; padding: 10px 16px; font-family: var(--font-display); font-size: 17px; color: #4a2f45; background: linear-gradient(180deg, #fff3b8, var(--gold)); box-shadow: 0 0 18px rgba(255, 215, 122, .6); cursor: pointer; z-index: 3; }
#fwbtn:active { transform: translateY(2px); }
#musicbtn { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(clamp(150px, 26vh, 230px) + 12px); border: 0; border-radius: 999px; padding: 10px 16px; font-family: var(--font-display); font-size: 17px; color: #4a2f45; background: linear-gradient(180deg, #fff, var(--pink-soft)); box-shadow: 0 0 14px rgba(255, 180, 210, .5); cursor: pointer; z-index: 3; }
#musicbtn[aria-pressed="true"] { background: linear-gradient(180deg, #ffd3e4, var(--pink)); color: #fff; }
#musicbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
#fwbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.bunny .hand {
  position: absolute; left: 50%; top: 62%; width: 82%; transform: translate(-50%, -50%);
  transition: opacity .3s, transform .3s;
}
.bunny .hand.gone { opacity: 0; transform: translate(-50%, -80%) scale(.6); }
.bunny .hand svg { display: block; width: 100%; height: auto; }
.tag {
  margin-top: 4px; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 17px; color: #fff4fa;
  background: rgba(0, 0, 0, .25); padding: 2px 12px; border-radius: 999px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #8a8aa0; }
.dot.on { background: #7be3a5; box-shadow: 0 0 6px #7be3a5; }
.dot.ready { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
@keyframes idle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px) scaleY(1.03); } }
.flame { transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1); } to { transform: scale(.85, 1.15); } }

#panel {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 380px; box-sizing: border-box;
  background: var(--card); border-radius: 22px; padding: 14px 16px 16px;
  box-shadow: 0 10px 40px rgba(20, 10, 50, .45);
  display: flex; flex-direction: column; gap: 10px;
}
#panel.min .collapsible { display: none; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--pink); text-wrap: balance; line-height: 1.1; }
h1 small { display: block; font-size: 14px; color: var(--ink-soft); font-family: var(--font-body); margin-top: 2px; }
.link { background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.label { font-size: 13px; color: var(--ink-soft); }
.who { flex: 1; min-width: 120px; padding: 12px; border-radius: 16px; border: 2px solid var(--pink-soft); background: #fff; font-family: var(--font-display); font-size: 20px; color: var(--ink); cursor: pointer; }
.who:hover, .who:focus-visible { border-color: var(--pink); outline: none; }
.designs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.design { border: 2px solid transparent; background: #fff; border-radius: 14px; padding: 4px 2px 6px; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink); }
.design[aria-pressed="true"] { border-color: var(--pink); background: #fff0f6; }
.design:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.design svg { display: block; width: 70%; margin: 0 auto; height: auto; }
input#wish { width: 100%; box-sizing: border-box; border: 2px solid var(--pink-soft); border-radius: 14px; padding: 9px 12px; font: inherit; font-size: 15px; color: var(--ink); background: #fff; color-scheme: light; }
input#wish:focus { outline: none; border-color: var(--pink); }
.status { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #f6e9f1; color: var(--ink); }
.hint { font-size: 14px; color: var(--ink); line-height: 1.45; margin: 0; }
#go {
  width: 100%; padding: 13px; border: 0; border-radius: 18px; cursor: pointer;
  font-family: var(--font-display); font-size: 21px; color: #fff;
  background: linear-gradient(180deg, #ff9cc4, var(--pink)); box-shadow: 0 4px 0 #e05f95;
}
#go:active { transform: translateY(2px); box-shadow: 0 2px 0 #e05f95; }
#go.waiting { background: linear-gradient(180deg, #c9b6ff, #9f86f0); box-shadow: 0 4px 0 #7c63d0; }
#go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

#countdown {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-display); font-size: clamp(90px, 28vw, 200px); color: #fff;
  text-shadow: 0 0 30px var(--pink), 0 0 60px rgba(255, 127, 176, .6);
}
#countdown span { animation: pop .9s ease-out forwards; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
#banner {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none;
  font-family: var(--font-display); font-size: clamp(28px, 7vw, 54px); color: #fff; text-align: center;
  text-shadow: 0 0 20px var(--pink), 0 2px 0 rgba(0, 0, 0, .2); width: 90%;
  opacity: 0;
}
#banner.show { animation: banner 5s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); } 15%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
@media (prefers-reduced-motion: reduce) {
  .bunny .body, .flame, .bunny.ready .body { animation: none; }
}
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <canvas id="bg"></canvas>
  <div id="temple"></div>
  <div id="temple-ref"></div>
  <div id="lanterns"></div>
  <div id="floats"></div>
  <div id="bank">
    <div id="pier"></div>
    <div class="stall" id="stallL"></div>
    <div class="stall" id="stallR"></div>
    <div id="bunnies">
      <div class="bunny" id="b-big"><div class="body"></div><div class="tag"><span class="dot"></span>บิ๊ก</div></div>
      <div class="bunny" id="b-kwan"><div class="body"></div><div class="tag"><span class="dot"></span>ขวัญ</div></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <button id="fwbtn" type="button">จุดพลุ</button>
  <button id="musicbtn" type="button" aria-pressed="false">♪ เปิดเพลง</button>
  <div id="banner"></div>
  <div id="countdown"></div>

  <section id="panel" aria-label="ควบคุมการลอยกระทง">
    <div class="head">
      <h1>ลอยกระทงด้วยกัน<small>บิ๊ก ♡ ขวัญ · คืนวันเพ็ญเดือนสิบสอง</small></h1>
      <button class="link" id="toggle" type="button">ซ่อน</button>
    </div>
    <div class="collapsible" id="pick" hidden>
      <p class="hint" style="margin-bottom:8px">เราคือใครเอ่ย?</p>
      <div class="row">
        <button class="who" id="pick-big" type="button">บิ๊ก</button>
        <button class="who" id="pick-kwan" type="button">ขวัญ</button>
      </div>
    </div>
    <div class="collapsible" id="main" hidden>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="sub"><span class="label" id="hello"></span><button class="link" id="switch" type="button">ไม่ใช่เรา?</button></div>
        <div>
          <div class="label" style="margin-bottom:4px">เลือกลายกระทง</div>
          <div class="designs" id="designs"></div>
        </div>
        <input id="wish" maxlength="80" placeholder="อธิษฐานในใจ (เห็นแค่เรา)" autocomplete="off">
        <div class="status" id="status"></div>
        <p class="hint" id="hint"></p>
        <button id="go" type="button">พร้อมลอย ♡</button>
        <div class="sub"><span class="label" id="mode"></span><button class="link" id="solo" type="button">ลอยเลยไม่รอ</button></div>
      </div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  const NAMES = { big: "บิ๊ก", kwan: "ขวัญ" };
  const OTHER = { big: "kwan", kwan: "big" };
  const DESIGNS = {
    pink:  { label: "ชมพูพาสเทล", leaf: "#8cc08a", leaf2: "#6aa36a", p1: "#ffe3ee", p2: "#ffb6cf", fl: "#fff6fa", dot: "#ff8fb5" },
    peach: { label: "สีโอรส",     leaf: "#8cc08a", leaf2: "#6aa36a", p1: "#ffe3d6", p2: "#ffab8f", fl: "#fff5ee", dot: "#ff8a6b" },
    blue:  { label: "ฟ้าพาสเทล",  leaf: "#8cc08a", leaf2: "#6aa36a", p1: "#deedff", p2: "#a8cbf5", fl: "#f6fbff", dot: "#7fb0ea" }
  };
  const BUNNY = { big: { bow: "#6fb0ff", dress: "#b4d9ff" }, kwan: { bow: "#ff7fb0", dress: "#ffc8dd" } };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const S = {
    me: ["big", "kwan"].includes(store.get("lk.me")) ? store.get("lk.me") : null,
    design: DESIGNS[store.get("lk.design")] ? store.get("lk.design") : "pink",
    ready: false,
    floats: parseInt(store.get("lk.floats") || "0", 10) || 0,
    fw: 0,
    counting: false
  };
  let room = null;
  const seen = {};

  // ---------- SVG builders ----------
  function krathongSVGCute(key) {
    const d = DESIGNS[key] || DESIGNS.pink;
    const n = (v) => v.toFixed(1);
    const flower5 = (x, y, r, c, mid) => {
      let s = "";
      for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - Math.PI / 2; s += `<circle cx="${n(x + Math.cos(a) * r)}" cy="${n(y + Math.sin(a) * r)}" r="${n(r * .85)}" fill="${c}"/>`; }
      return s + `<circle cx="${x}" cy="${y}" r="${n(r * .6)}" fill="${mid}"/>`;
    };
    const star = (x, y, r, c) => {
      let p = "";
      for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2 - Math.PI / 2, rr = k % 2 ? r * .45 : r; p += `${k ? "L" : "M"}${n(x + Math.cos(a) * rr)} ${n(y + Math.sin(a) * rr)}`; }
      return `<path d="${p}Z" fill="${c}" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/>`;
    };
    const heart = (x, y, r, c) => `<path d="M${x} ${n(y + r * .9)} C${n(x - r * 1.6)} ${n(y - r * .2)} ${n(x - r * .6)} ${n(y - r * 1.3)} ${x} ${n(y - r * .4)} C${n(x + r * .6)} ${n(y - r * 1.3)} ${n(x + r * 1.6)} ${n(y - r * .2)} ${x} ${n(y + r * .9)} Z" fill="${c}"/>`;
    const sun = (x, y, r) => {
      let s = "";
      for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; s += `<ellipse cx="${n(x + Math.cos(a) * r)}" cy="${n(y + Math.sin(a) * r)}" rx="${n(r * .55)}" ry="${n(r * .3)}" transform="rotate(${n(a * 180 / Math.PI)} ${n(x + Math.cos(a) * r)} ${n(y + Math.sin(a) * r)})" fill="#ffcf3d"/>`; }
      return s + `<circle cx="${x}" cy="${y}" r="${n(r * .7)}" fill="#8a5a2c"/><circle cx="${n(x - r * .2)}" cy="${n(y - r * .2)}" r="${n(r * .15)}" fill="#c48a4a"/>`;
    };
    const candy = (x, y, r, c) => `<line x1="${x}" y1="${y}" x2="${x}" y2="${n(y + r * 2.2)}" stroke="#fff" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#fff" stroke-width="1.2"/><path d="M${n(x - r * .5)} ${y} a${n(r * .5)} ${n(r * .5)} 0 1 1 ${n(r * .5)} ${n(r * .5)}" stroke="#fff" stroke-width="1.2" fill="none"/>`;
    const deco = (x, y, r, i) => {
      switch (d.deco) {
        case "star": return star(x, y, r * 1.3, i % 2 ? "#ffe066" : "#fff6c2");
        case "sun": return sun(x, y, r * .95);
        case "heart": return heart(x, y, r * 1.1, i % 2 ? "#ff5d8f" : "#ff9cbc");
        case "candy": return candy(x, y - 2, r * .95, ["#ff9cc4", "#9cd3ff", "#ffe08a", "#b8f0c8", "#d7b4ff"][i % 5]);
        default: return flower5(x, y, r * .7, i % 2 ? d.fl : "#fff", d.dot);
      }
    };
    let leaves = "";
    for (let i = 0; i < 11; i++) {
      const x = 8 + i * 10.4;
      leaves += `<path d="M${n(x - 6)} 72 Q${n(x - 3)} 60 ${n(x)} ${56 - (i % 2) * 3} Q${n(x + 3)} 60 ${n(x + 6)} 72 Z" fill="${i % 2 ? d.leaf : d.leaf2}"/>`;
    }
    let petals = "";
    for (let i = 0; i < 7; i++) { const x = 21 + i * 13; petals += `<path d="M${x - 8} 64 Q${x - 6} 44 ${x} 38 Q${x + 6} 44 ${x + 8} 64 Z" fill="${d.p1}" stroke="${d.p2}" stroke-width="1.2"/><path d="M${x} 44 L${x} 58" stroke="${d.p2}" stroke-width=".8" opacity=".6"/>`; }
    let petals2 = "";
    for (let i = 0; i < 5; i++) { const x = 34 + i * 13; petals2 += `<path d="M${x - 7} 62 Q${x - 5} 46 ${x} 41 Q${x + 5} 46 ${x + 7} 62 Z" fill="${d.p2}"/>`; }
    let decos = "";
    [[36, 54, 0], [84, 54, 1], [48, 62, 2], [72, 62, 3], [60, 64, 4]].forEach(([x, y, i]) => { decos += deco(x, y, 5.2, i); });
    const sparkle = (x, y, s) => `<path d="M${x} ${y - s} L${x + s * .3} ${y - s * .3} L${x + s} ${y} L${x + s * .3} ${y + s * .3} L${x} ${y + s} L${x - s * .3} ${y + s * .3} L${x - s} ${y} L${x - s * .3} ${y - s * .3} Z" fill="#fff8d6"/>`;

  // ---------- room ----------
  function push() {
    if (!room) return;
    room.presence({ name: S.me, design: S.design, ready: S.ready, floats: S.floats, fw: S.fw }).catch(() => {});
  }
  function peersOf(name) {
    if (!room) return [];
    return room.peers().filter(p => p.kind === "viewer" && !p.sameTab && p.presence && p.presence.name === name);
  }
  function partnerPeer() {
    if (!S.me) {
      return null;
    }
    const list = peersOf(OTHER[S.me]);
    if (!list.length) return null;
    return list.reduce((a, b) => (b.updatedAt > a.updatedAt ? b : a));
  }
  function peerFor(name) {
    const list = peersOf(name);
    return list.length ? list.reduce((a, b) => (b.updatedAt > a.updatedAt ? b : a)) : null;
  }
  function safeDesign(v) { return typeof v === "string" && DESIGNS[v] ? v : null; }
  function safeInt(v) { return Number.isFinite(v) ? Math.max(0, Math.floor(v)) : 0; }

  let partnerFloatsAtStart = 0;
  const seenFw = new Map();
  function onRoomChange() {
    if (room) {
      for (const p of room.peers()) {
        if (p.sameTab || !p.presence) continue;
        const f = safeInt(p.presence.fw);
        const prev = seenFw.get(p.peer);
        seenFw.set(p.peer, f);
        if (prev !== undefined && f > prev) fireworkShow(4);
      }
    }
    for (const name of ["big", "kwan"]) {
      if (name === S.me) continue;
      const p = peerFor(name);
      if (!p) continue;
      const f = safeInt(p.presence.floats);
      const des = safeDesign(p.presence.design) || handDesign[name];
      if (seen[name] === undefined || f < seen[name]) { seen[name] = f; continue; }
      if (f > seen[name]) {
        const n = Math.min(3, f - seen[name]);
        seen[name] = f;
        if (!S.counting) for (let i = 0; i < n; i++) setTimeout(() => launch(name, des, ""), i * 700);
      }
    }
    render();
    checkSync();
  }
  function checkSync() {
    const partner = partnerPeer();
    if (S.ready && partner && partner.presence.ready === true && !S.counting) startCountdown(partner);
  }
  function startCountdown(partner) {
    S.counting = true;
    setPanelMin(true);
    partnerFloatsAtStart = safeInt(partner.presence.floats);
    const partnerDesign = safeDesign(partner.presence.design) || handDesign[OTHER[S.me]];
    render();
    const cd = $("countdown");
    let n = 3;
    const tick = () => {
      if (n === 0) {
        cd.innerHTML = "";
        const other = OTHER[S.me];
        launch(S.me, S.design, $("wish").value.trim());
        launch(other, partnerDesign, "");
        seen[other] = Math.max(seen[other] || 0, partnerFloatsAtStart + 1);
        S.floats++; store.set("lk.floats", String(S.floats));
        S.ready = false; S.counting = false;
        $("wish").value = "";
        push(); render();
        celebrate(true);
        return;
      }
      cd.innerHTML = "";
      const s = document.createElement("span"); s.textContent = n; cd.appendChild(s);
      n--; setTimeout(tick, 1000);
    };
    tick();
  }
  function soloLaunch() {
    launch(S.me, S.design, $("wish").value.trim());

  // ---------- render ----------

    $("pick").hidden = !!S.me;
    $("main").hidden = !S.me;
    for (const b of designsEl.children) b.setAttribute("aria-pressed", String(b.dataset.key === S.design));
    const status = {};
    for (const name of ["big", "kwan"]) {
      const mine = name === S.me;
      const p = mine ? null : peerFor(name);
      const online = mine || !!p;
      const ready = mine ? S.ready : !!(p && p.presence.ready === true);
      status[name] = { online, ready };

      bgc.fillStyle = ["#ff7fb0", "#ffd77a", "#7fb8ff", "#9ff0c8"][i % 4];
      bgc.globalAlpha = .85;
      bgc.beginPath(); bgc.moveTo(ax, ay); bgc.lineTo(bx, by); bgc.lineTo((ax + bx) / 2 + sway, (ay + by) / 2 + 16); bgc.closePath(); bgc.fill();
    }
    bgc.globalAlpha = 1;
    // Ferris wheel on the far bank
    const r = Math.min(80, Math.max(34, W * .07));
    const cx = Math.max(r + 8, W * .1), cy = hz - r - 14;
    bgc.strokeStyle = "#5a3f7a"; bgc.lineWidth = 3;
    bgc.beginPath(); bgc.moveTo(cx - r * .55, hz); bgc.lineTo(cx, cy); bgc.lineTo(cx + r * .55, hz); bgc.stroke();
    const rot = t / 6000;
    bgc.lineWidth = 1.2; bgc.strokeStyle = "rgba(255,220,170,.55)";
    for (let i = 0; i < 12; i++) {
      const a = rot + i * Math.PI / 6;
      bgc.beginPath(); bgc.moveTo(cx, cy); bgc.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); bgc.stroke();
    }
    bgc.lineWidth = 2; bgc.strokeStyle = "rgba(255,200,230,.7)";
    bgc.beginPath(); bgc.arc(cx, cy, r, 0, 7); bgc.stroke();
    for (let i = 0; i < 24; i++) {
      const a = rot + i * Math.PI / 12;
      bgc.fillStyle = BULB[(i + Math.floor(t / 400)) % BULB.length];
      bgc.shadowColor = bgc.fillStyle; bgc.shadowBlur = 8;
      bgc.beginPath(); bgc.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2.2, 0, 7); bgc.fill();
    }
    bgc.shadowBlur = 0;
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4;
      const gx = cx + Math.cos(a) * r, gy = cy + Math.sin(a) * r;
      bgc.fillStyle = BULB[i % BULB.length];
      bgc.fillRect(gx - r * .08, gy + 2, r * .16, r * .12);
    }
    bgc.fillStyle = "#ffd77a"; bgc.beginPath(); bgc.arc(cx, cy, 3.5, 0, 7); bgc.fill();
    // far-bank market stalls with lights
    const sx0 = W * .8;
    for (let k = 0; k < 3; k++) {
      const sw = Math.min(46, W * .05), x = sx0 + k * (sw + 6), y = hz - 18;
      if (x + sw > W) break;
      bgc.fillStyle = "rgba(255,206,140,.35)"; bgc.fillRect(x, y, sw, 16);
      bgc.fillStyle = ["#e0485a", "#4f8fd8", "#e8a43a"][k];
      bgc.beginPath(); bgc.moveTo(x - 3, y); bgc.lineTo(x + sw / 2, y - 12); bgc.lineTo(x + sw + 3, y); bgc.closePath(); bgc.fill();
      for (let b = 0; b <= 4; b++) {
        bgc.fillStyle = BULB[(b + k) % BULB.length];
        bgc.globalAlpha = .6 + .4 * Math.abs(Math.sin(t / 450 + b + k));
        bgc.beginPath(); bgc.arc(x + b * sw / 4, y + 1, 1.8, 0, 7); bgc.fill();
      }
      bgc.globalAlpha = 1;
    }
  }

  function drawFx(t) {
    fxc.clearRect(0, 0, W, H);
    for (const f of flies) {
      f.x += Math.cos(t / 1500 + f.p) * f.v; f.y += Math.sin(t / 1100 + f.p) * f.v * .6;
      if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
      const a = .3 + .7 * Math.abs(Math.sin(t / 600 + f.p));
      fxc.fillStyle = `rgba(255,236,140,${a})`;
      fxc.shadowColor = "#ffe68a"; fxc.shadowBlur = 8;
      fxc.beginPath(); fxc.arc(f.x, f.y, 1.8, 0, 7); fxc.fill();
    }
    fxc.shadowBlur = 0;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life++; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.vy *= .985;
      const a = 1 - p.life / p.max;
      if (a <= 0) { particles.splice(i, 1); continue; }
      fxc.globalAlpha = a;
      if (p.type === "rocket") {
        fxc.fillStyle = "#fff2c4"; fxc.beginPath(); fxc.arc(p.x, p.y, 2.2, 0, 7); fxc.fill();
        if (p.life % 2 === 0) particles.push({ type: "spark", x: p.x, y: p.y, vx: (Math.random() - .5) * .4, vy: .6, g: .01, life: 0, max: 26, color: "#ffcf7a", size: 1.3 });
        if (p.vy >= -0.6 || p.y <= p.ty) { particles.splice(i, 1); burst(p.x, p.y, p.kind); }
        continue;
      }
      if (p.type === "heart") {
        fxc.fillStyle = p.color; fxc.font = `${p.size}px sans-serif`; fxc.fillText("♥", p.x, p.y);
      } else {
        fxc.fillStyle = p.color; fxc.beginPath(); fxc.arc(p.x, p.y, p.size, 0, 7); fxc.fill();
      }
    }
    fxc.globalAlpha = 1;
  }

  function hearts(x, y, color) {
    for (let i = 0; i < 14; i++) {
      particles.push({ type: "heart", x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 3 - 1.5, g: .02, life: 0, max: 70 + Math.random() * 40, color: i % 3 ? color : "#fff", size: 12 + Math.random() * 10 });
    }
  }
  const FW_COLORS = ["#ff8fbf", "#ffd77a", "#9cc9ff", "#c9a8ff", "#9ff0c8", "#ffffff", "#ffb07a"];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function burst(x, y, kind) {
    const c = pick(FW_COLORS), c2 = pick(FW_COLORS);
    const scale = Math.min(W, H) / 420;
    if (kind === "heart") {
      for (let i = 0; i < 70; i++) {
        const t = (i / 70) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        particles.push({ type: "spark", x, y, vx: hx * .2 * scale, vy: hy * .2 * scale, g: .012, life: 0, max: 80, color: i % 5 ? "#ff8fbf" : "#fff", size: 2.2 });
      }
    } else if (kind === "willow") {
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 2.6) * scale;
        particles.push({ type: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .045, life: 0, max: 110 + Math.random() * 40, color: i % 3 ? "#ffd77a" : "#fff2c4", size: 1.6 });
      }
    } else {
      for (let i = 0; i < 80; i++) {
        const a = (i / 80) * Math.PI * 2, sp = (2.4 + (i % 2) * 1.4) * scale;
        particles.push({ type: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .035, life: 0, max: 65 + Math.random() * 30, color: i % 2 ? c : c2, size: 2 });
      }
      for (let i = 0; i < 6; i++) particles.push({ type: "heart", x, y, vx: (Math.random() - .5) * 2.5, vy: (Math.random() - .5) * 2.5, g: .02, life: 0, max: 80, color: c, size: 14 });
    }
  }
  function rocket(kind) {
    const x = W * (.12 + Math.random() * .76), ty = H * (.08 + Math.random() * .24);
    const y = H * .46;
    const vy = -Math.sqrt(2 * .06 * (y - ty)) - .3;
    particles.push({ type: "rocket", x, y, vx: (Math.random() - .5) * .8, vy, g: .06, life: 0, max: 400, ty, kind: kind || pick(["ring", "ring", "heart", "willow"]) });
  }
  function firework(x, y) { burst(x, y, pick(["ring", "heart", "willow"])); }
  function fireworkShow(n) {
    for (let i = 0; i < n; i++) setTimeout(() => rocket(), i * (380 + Math.random() * 300));
  }
  $("fwbtn").onclick = () => {
    fireworkShow(5);
    S.fw++; push();
  };
  function lanterns(n) {
    const box = $("lanterns");
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const l = document.createElement("div");
        l.className = "lantern";
        l.style.left = (5 + Math.random() * 90) + "%";
        l.style.setProperty("--dur", (14 + Math.random() * 8) + "s");
        l.style.setProperty("--sway", ((Math.random() - .5) * 80) + "px");
        l.addEventListener("animationend", () => l.remove());
        box.appendChild(l);
      }, i * 450);
    }
  }
  function celebrate(together) {
    const b = $("banner");
    b.textContent = together ? "ลอยพร้อมกันแล้ว ♡ บิ๊ก & ขวัญ" : "ลอยไปแล้ว ♡";
    b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
    lanterns(together ? 14 : 6);
    setTimeout(() => fireworkShow(together ? 14 : 5), 400);
    if (together) setTimeout(() => { rocket("heart"); rocket("heart"); }, 7000);
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(t) {
    drawBg(reduce ? 0 : t);
    drawFx(t);
    stepFloaters(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  lanterns(4);
  setInterval(() => { if (!document.hidden) lanterns(1); }, 7000);
  setInterval(() => { if (!document.hidden && !reduce) rocket(); }, 6500);
  setTimeout(() => fireworkShow(3), 800);

  render();


  // ---------- character pictures: put big.png / kwan.png next to this file ----------
  const CHAR_IMG = { big: "big.png", kwan: "kwan.png" };
  const CHAR_POS = { big: { x: 51.7, y: 74 }, kwan: { x: 52.7, y: 72.6 } };
  function useImage(who) {
    const img = new Image();
    img.className = "b"; img.alt = NAMES[who];
    img.onload = () => {
      artEl[who].innerHTML = "";
      artEl[who].appendChild(img);
      bunnyEl[who].classList.add("custom");
      handEl[who].style.left = CHAR_POS[who].x + "%";
      handEl[who].style.top = CHAR_POS[who].y + "%";
    };
    img.src = CHAR_IMG[who];
  }
  useImage("big"); useImage("kwan");

  // ---------- music: bgm.mp3 if present, otherwise an original Thai-style tune ----------
  const music = (() => {
    let on = false, userOff = false, audioEl = null, useFile = null, ctx = null, master = null, timer = null, step = 0, nextTime = 0;
    const BPM = 96, STEP = 60 / BPM / 2;
    const m2f = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // original melody on a C pentatonic scale (0 = rest)
    const MEL = [
      76, 79, 81, 79, 76, 74, 72, 0,   74, 76, 79, 76, 74, 72, 74, 0,
      76, 79, 81, 84, 81, 79, 76, 0,   79, 81, 79, 76, 74, 76, 79, 0,
      81, 84, 81, 79, 76, 79, 81, 0,   79, 76, 74, 76, 79, 76, 74, 0,
      72, 74, 76, 79, 76, 74, 72, 74,  76, 74, 72, 0,  72, 0,  0,  0
    ];
    const BASS = [48, 0, 55, 0, 48, 0, 55, 0, 45, 0, 52, 0, 43, 0, 50, 0];
    function pluck(t, freq, vol, len) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = freq;
      o2.type = "sine"; o2.frequency.value = freq * 2.01;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0008, t + len);
      const g2 = ctx.createGain(); g2.gain.value = .3;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
      o.start(t); o2.start(t); o.stop(t + len + .05); o2.stop(t + len + .05);
    }
    function ching(t, open) {
      const len = open ? .5 : .07;
      [2637, 3520, 4186].forEach((f) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(open ? .035 : .05, t); g.gain.exponentialRampToValueAtTime(.0005, t + len);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + len + .02);
      });
    }
    function schedule() {
      while (nextTime < ctx.currentTime + .25) {
        const n = MEL[step % MEL.length];
        if (n) pluck(nextTime, m2f(n), .16, STEP * 2.6);
        const b = BASS[step % BASS.length];
        if (b) pluck(nextTime, m2f(b), .12, STEP * 3.5);
        if (step % 2 === 0) ching(nextTime, step % 4 === 0);
        nextTime += STEP; step++;
      }
    }
    function startSynth() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
      ctx.resume();
      nextTime = ctx.currentTime + .05;
      clearInterval(timer); timer = setInterval(schedule, 60);
    }
    function stopSynth() { clearInterval(timer); timer = null; if (ctx) ctx.suspend(); }
    function start() {
      on = true; render();
      if (useFile === false) { startSynth(); return; }
      if (!audioEl) {
        audioEl = new Audio("bgm.mp3"); audioEl.loop = true; audioEl.volume = .6;
        audioEl.addEventListener("error", () => { useFile = false; if (on) startSynth(); }, { once: true });
      }
      audioEl.play().then(() => { useFile = true; }).catch(() => { useFile = false; if (on) startSynth(); });
    }
    function stop() { on = false; render(); if (audioEl) audioEl.pause(); stopSynth(); }
    function render() {
      const b = $("musicbtn");
      b.setAttribute("aria-pressed", String(on));
      b.textContent = on ? "♪ ปิดเพลง" : "♪ เปิดเพลง";
    }
    $("musicbtn").onclick = () => { if (on) { userOff = true; stop(); } else { userOff = false; start(); } };
    document.addEventListener("visibilitychange", () => {
      if (!on) return;
      if (document.hidden) { if (audioEl) audioEl.pause(); if (ctx) ctx.suspend(); }
      else if (useFile) audioEl.play().catch(() => {}); else if (ctx) { ctx.resume(); nextTime = ctx.currentTime + .05; }
    });
    return { autoStart() { if (!on && !userOff) start(); } };
  })();
  ["go", "solo", "pick-big", "pick-kwan"].forEach((id) => $(id).addEventListener("click", () => music.autoStart()));

  // ---------- realtime sync over a public MQTT broker (no login) ----------
  const ROOM_TOPIC = "loykrathong-bk/" + "r7q3m9x2v5";
  const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
  const STALE_MS = 3 * 60 * 1000;
  function makeRoom() {
    if (!window.mqtt) return null;
    const myId = Math.random().toString(36).slice(2, 12);
    const others = new Map();
    let mine = {}, frozen = Object.freeze([]), listeners = [], client = null, brokerIdx = 0;
    const stateTopic = (id) => ROOM_TOPIC + "/state/" + id;
    function rebuild() {
      const now = Date.now();
      const list = [];
      for (const [id, v] of others) {
        if (now - v.seenAt > STALE_MS && now - (v.presence.t || 0) > STALE_MS) continue;
        list.push(Object.freeze({ peer: id, kind: "viewer", sameTab: false, isMe: false, presence: Object.freeze(v.presence), updatedAt: v.updatedAt }));
      }
      frozen = Object.freeze(list);
      listeners.forEach((fn) => { try { fn({ peers: frozen }); } catch (e) {} });
    }
    function publishMine() {
      if (!client || !client.connected) return;
      client.publish(stateTopic(myId), JSON.stringify({ ...mine, t: Date.now() }), { retain: true, qos: 1 });
    }
    function connect() {
      const url = BROKERS[brokerIdx % BROKERS.length];
      client = mqtt.connect(url, {
        clientId: "lk_" + myId, clean: true, reconnectPeriod: 3000, connectTimeout: 8000,
        will: { topic: stateTopic(myId), payload: "", retain: true, qos: 1 }
      });
      let opened = false;
      const failover = setTimeout(() => { if (!opened) { client.end(true); brokerIdx++; connect(); } }, 9000);
      client.on("connect", () => {
        opened = true; clearTimeout(failover);
        client.subscribe(ROOM_TOPIC + "/state/+", { qos: 1 });
        publishMine();
      });
      client.on("message", (topic, payload) => {
        const id = topic.split("/").pop();
        if (id === myId) return;
        const text = payload.toString();
        if (!text) { others.delete(id); rebuild(); return; }
        let data;
        try { data = JSON.parse(text); } catch (e) { return; }
        if (!data || typeof data !== "object") return;
        const prev = others.get(id);
        if (Date.now() - (data.t || 0) > STALE_MS && !prev) return;
        others.set(id, { presence: data, updatedAt: Date.now(), seenAt: Date.now() });
        rebuild();
      });
    }
    connect();
    addEventListener("pagehide", () => { try { client.publish(stateTopic(myId), "", { retain: true, qos: 0 }); client.end(); } catch (e) {} });
    setInterval(() => { publishMine(); rebuild(); }, 60000);
    return {
      peers: () => frozen,
      presence(patch) { mine = { ...mine, ...patch }; publishMine(); return Promise.resolve(); },
      onPeers(fn) { listeners.push(fn); setTimeout(() => fn({ peers: frozen }), 0); return () => {}; }
    };
  }
  room = makeRoom();
  if (room) { room.onPeers(onRoomChange); push(); }
  render();
})();
</script>
